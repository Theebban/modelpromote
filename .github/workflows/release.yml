# PUBLISH TO NPM VIA TRUSTED PUBLISHING (OIDC). NO TOKEN IS STORED ANYWHERE.
#
# Releasing needs TWO human approvals, on purpose:
#
#   tag v*  ->  verify (no credentials)  ->  [1] a reviewer releases the `release` environment
#                                        ->  npm stage publish
#                                        ->  [2] a maintainer approves the staged version with 2FA
#                                        ->  it becomes public
#
# The trusted publisher for this package is deliberately configured WITHOUT
# "Allow npm publish", so this workflow can only ever STAGE. Even if it were
# compromised it could not make a version public on its own, because the second
# approval happens off this machine, on npm, behind 2FA.
#
# VERIFY AND PUBLISH ARE SEPARATE JOBS. Installing packages runs lifecycle scripts, and
# none should run where a publishing credential can be minted. So every check, including
# the consumer-path check by asinstalled, runs in `verify`, which has no id-token
# permission; `publish` installs with --ignore-scripts and only packs and stages.
#
# npm side, already configured:
#   Trusted publisher: GitHub Actions, Theebban/modelpromote, release.yml, environment `release`
#   Allowed actions  : stage only
#   Publishing access: require 2FA, disallow bypass-2FA tokens
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run check
      - run: bash scripts/package-smoke.sh

      # The release as its users will receive it: packed, installed into a clean project,
      # imported and run on the engines floor (an official Node 22.0.0 build, checksum
      # verified) and on current Node. asinstalled is installed from npm, pinned to an exact version.
      - name: consumer path (asinstalled)
        run: npx --yes asinstalled@0.1.0 check --dir . --run "modelpromote --help"
      - name: documentation matches the package (asinstalled)
        run: npx --yes asinstalled@0.1.0 docs --dir .

      - name: the tag must match the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Carries a required reviewer. The run pauses here until a human releases it.
    environment: release
    permissions:
      contents: read
      # This is what replaces a stored npm token. Without it, OIDC cannot mint
      # the short-lived credential and the publish fails closed.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Staged publishing requires Node >=22.14 and npm >=11.15. This is a
          # requirement of the PUBLISHING environment and has nothing to do with
          # engines.node, which is the floor the PACKAGE promises its consumers.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: the toolchain must actually meet npm's staged-publishing floor
        run: |
          node -v && npm -v
          node -e '
            const [nMaj,nMin] = process.versions.node.split(".").map(Number);
            if (nMaj < 22 || (nMaj === 22 && nMin < 14)) {
              throw new Error("staged publishing needs Node >=22.14, got " + process.version);
            }
          '
          npm -v | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 15)) { print "staged publishing needs npm >=11.15.0, got " $0; exit 1 } }'

      # No install script runs in the job that can mint a publishing credential.
      - run: npm ci --ignore-scripts

      # STAGE, never publish. The trusted publisher is not permitted to publish
      # directly, so this is the only command that can succeed here.
      # No --provenance flag: under trusted publishing npm attaches provenance
      # automatically for a public package from a public repository.
      - name: stage the release for human approval
        run: npm stage publish

      - name: how to complete the release
        run: |
          echo "Staged. It is NOT public yet."
          echo "Approve it with 2FA, either:"
          echo "  npm stage list modelpromote && npm stage approve <stage-id>"
          echo "or on npmjs.com -> the package -> Staged Packages -> Approve."
