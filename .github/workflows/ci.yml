# CI for a future GitHub remote. Not active: this repository has no remote yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.0 is the floor declared in package.json engines, and it is tested here so the
        # declared floor is a fact rather than a claim. 22.6 is kept because the source
        # workflow needs it: the test and demo scripts run TypeScript directly via
        # --experimental-strip-types, which landed in 22.6. The published package is plain
        # JavaScript and needs neither.
        node: ['22.0', '22.6', '22.x', '24.x', 'current']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Runs BEFORE any install: the demo and the tests must work from a bare clone,
      # because the core has zero runtime dependencies. If this step ever needs an install,
      # that claim has quietly become false.
      - name: tests and demo with no install
        run: |
          npm test
          npm run demo

      - name: install dev tooling
        run: npm install

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # The installed-package path: build, pack, install the tarball into a throwaway
      # project, run the installed binary, drive a lifecycle, import the library.
      # This is what catches a `bin` that points at something Node cannot execute.
      - name: package smoke (build, pack, install, run)
        run: bash scripts/package-smoke.sh

      # Each safety invariant must fail when the implementation is deliberately broken.
      - name: mutation testing
        run: bash scripts/mutate.sh
