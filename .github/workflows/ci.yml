name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These jobs run the SOURCE workflow, which executes TypeScript directly via
        # --experimental-strip-types. That flag landed in 22.6, so 22.6 is the floor for
        # CONTRIBUTING, and it is the lowest version this matrix can meaningfully use.
        #
        # It is NOT the floor package.json declares. `engines` is a promise to CONSUMERS,
        # who install plain JavaScript and never run this workflow, so the declared floor is
        # verified through the consumer path in the `floor` job below. Testing a consumer
        # promise with a maintainer workflow was the mistake that produced this comment.
        node: ['22.6', '22.x', '24.x', 'current']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Runs BEFORE any install: the demo and the tests must work from a bare clone,
      # because the core has zero runtime dependencies. If this step ever needs an install,
      # that claim has quietly become false.
      - name: tests and demo with no install
        run: |
          npm test
          npm run demo

      - name: install dev tooling
        run: npm install

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # The installed-package path: build, pack, install the tarball into a throwaway
      # project, run the installed binary, drive a lifecycle, import the library.
      # This is what catches a `bin` that points at something Node cannot execute.
      - name: package smoke (build, pack, install, run)
        run: bash scripts/package-smoke.sh

      # Each safety invariant must fail when the implementation is deliberately broken.
      - name: mutation testing
        run: bash scripts/mutate.sh

  # THE DECLARED FLOOR, verified the way a consumer meets it.
  #
  # package.json says engines.node >=22.0.0. That claim is about the PUBLISHED PACKAGE, so
  # it is tested by building and packing on a modern Node, then installing the tarball on
  # the exact declared floor and driving a real lifecycle through the installed binary.
  # Nothing here runs the source workflow, because a consumer never does.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build and pack on a modern Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm install
      - run: npm run build
      - run: npm pack --pack-destination /tmp

      - name: switch to the exact declared floor
        uses: actions/setup-node@v4
        with:
          node-version: '22.0'

      - name: the declared floor must actually run the published package
        run: |
          node -v
          DECLARED=$(node -p "require('./package.json').engines.node")
          echo "declared engines floor: $DECLARED"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install /tmp/modelpromote-*.tgz
          MP=./node_modules/.bin/modelpromote
          test -x "$MP"
          "$MP" --help > /dev/null
          mkdir -p proj
          "$MP" init --root proj > /dev/null
          "$MP" register demo-candidate --root proj > /dev/null
          if "$MP" activate --actor ci --root proj > /dev/null 2>&1; then
            echo "activation was allowed before approval"; exit 1
          fi
          "$MP" evaluate --root proj > /dev/null
          "$MP" approve --actor ci --root proj > /dev/null
          "$MP" activate --actor ci --root proj > /dev/null
          "$MP" verify --root proj | grep -q "confirmed     : YES"
          "$MP" close --actor ci --root proj > /dev/null
          "$MP" register demo-regression --root proj > /dev/null
          node --input-type=module -e "
            import { nextState, assertCrossEventConsistency } from 'modelpromote';
            if (nextState('APPROVED','beginActivation') !== 'ACTIVATING') throw new Error('nextState');
            if (typeof assertCrossEventConsistency !== 'function') throw new Error('exports');
            console.log('library import ok on ' + process.version);
          "

  # THE PACKAGE AS ITS USERS RECEIVE IT, checked by asinstalled (the same author's tool,
  # pinned to an exact release). Additive for now: the hand-written `floor` job above stays
  # until this has a track record. Runs with no publishing credentials, as asinstalled
  # advises, because installing runs lifecycle scripts.
  consumer-path:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Theebban/asinstalled
          ref: v0.1.0
          path: .asinstalled
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - name: pack, install, import and run on the engines floor and current Node
        run: node --experimental-strip-types .asinstalled/src/cli.ts check --dir . --run "modelpromote --help"
      - name: documentation matches the package
        run: node --experimental-strip-types .asinstalled/src/cli.ts docs --dir .
